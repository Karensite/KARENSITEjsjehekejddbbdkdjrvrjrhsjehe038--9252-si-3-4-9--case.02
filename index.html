<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Memory Chat</title>
    <style>
        body { margin: 0; font-family: Tahoma; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; height: 100vh; }
        .app { width: 100%; max-width: 450px; background: #161b22; height: 100%; display: flex; flex-direction: column; border-left: 1px solid #30363d; border-right: 1px solid #30363d; }
        .page { display: none; height: 100%; flex-direction: column; }
        .page.active { display: flex; }
        .auth { padding: 30px; text-align: center; margin: auto; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        
        .hdr { padding: 15px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 13px; word-wrap: break-word; line-height: 1.4; }
        .msg.sent { background: #1f6feb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.rcv { background: #30363d; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .inp-area { padding: 10px; border-top: 1px solid #30363d; display: flex; gap: 5px; }
        .status { font-size: 10px; color: #8b949e; text-align: center; padding: 2px; background: #0d1117; border-bottom: 1px solid #30363d; }
    </style>
</head>
<body>
    <div class="app">
        <div id="lp" class="page active">
            <div class="auth">
                <h2 style="color:#58a6ff">Case Memory</h2>
                <p style="font-size:12px;color:#8b949e">ذخیره‌سازی مستقیم در گیت‌هاب شخصی</p>
                <input type="text" id="u" placeholder="نام کاربری دلخواه">
                <button onclick="login()">ورود به چت</button>
            </div>
        </div>
        <div id="cp" class="page">
            <div class="hdr">
                <span style="font-weight:bold;color:#58a6ff">چت خصوصی</span>
                <button onclick="location.reload()" style="width:auto;background:#da3633;padding:5px 10px;font-size:12px">خروج</button>
            </div>
            <div class="status" id="st">وضعیت: آماده</div>
            <div class="msgs" id="mc"></div>
            <div class="inp-area">
                <input type="text" id="mi" placeholder="پیام خود را بنویسید..." onkeypress="if(event.key==='Enter')send()">
                <button onclick="send()" style="width:50px;margin:0">➤</button>
            </div>
        </div>
    </div>

<script>
    // ================= تنظیمات گیت‌هاب =================
    const TOKEN = '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'; 
    const OWNER = 'karensite'; 
    const REPO = 'Casememory';       
    const PATH = 'data.json'; 
    
    let me = null;
    const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;

    async function getData() {
        try {
            const r = await fetch(API, { headers: { Authorization: `Bearer ${TOKEN}` } });
            if(!r.ok) return null;
            const data = await r.json();
            const jsonStr = atob(data.content);
            return JSON.parse(jsonStr);
        } catch(e) { return null; }
    }

    async function saveData(newData) {
        const st = document.getElementById('st');
        st.innerText = '⏳ در حال ارسال به گیت‌هاب...';
        st.style.color = '#d29922';
        
        try {
            const current = await fetch(API, { headers: { Authorization: `Bearer ${TOKEN}` } });
            const currentData = await current.json();
            const sha = currentData.sha;

            const content = btoa(unescape(encodeURIComponent(JSON.stringify(newData))));

            const res = await fetch(API, {
                method: 'PUT',
                headers: { 
                    Authorization: `Bearer ${TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Chat update by ${me}`,
                    content: content,
                    sha: sha
                })
            });

            if(res.ok) {
                st.innerText = '✅ ذخیره شد در Casememory';
                st.style.color = '#3fb950';
                return true;
            } else {
                throw new Error('Save failed');
            }
        } catch(e) {
            console.error(e);
            st.innerText = '❌ خطا در ذخیره (توکن یا دسترسی را چک کن)';
            st.style.color = '#f85149';
            return false;
        }
    }

    async function login() {
        const u = document.getElementById('u').value.trim();
        if(!u) return alert('لطفاً یک نام کاربری وارد کنید');
        me = u;
        document.getElementById('lp').classList.remove('active');
        document.getElementById('cp').classList.add('active');
        loadMsgs();
        setInterval(loadMsgs, 4000);
    }

    async function loadMsgs() {
        const db = await getData();
        if(!db) return;
        
        const c = document.getElementById('mc');
        const wasAtBottom = c.scrollHeight - c.scrollTop <= c.clientHeight + 50;
        
        c.innerHTML = '';
        db.messages.slice(-50).forEach(m => {
            const d = document.createElement('div');
            d.className = `msg ${m.u === me ? 'sent' : 'rcv'}`;
            d.innerHTML = `<small style="opacity:0.7;display:block;margin-bottom:2px">${m.u}</small>${m.t}`;
            c.appendChild(d);
        });
        
        if(wasAtBottom) c.scrollTop = c.scrollHeight;
    }

    async function send() {
        const i = document.getElementById('mi');
        const txt = i.value.trim();
        if(!txt) return;
        
        i.disabled = true;
        
        let db = await getData();
        if(!db) db = { users: [], messages: [] }; 
        
        db.messages.push({ u: me, t: txt, time: Date.now() });
        if(db.messages.length > 100) db.messages = db.messages.slice(-100);
        
        const saved = await saveData(db);
        if(saved) {
            i.value = '';
            loadMsgs();
        }
        i.disabled = false;
        i.focus();
    }
</script>
</body>
                  </html>
